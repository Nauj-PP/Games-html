<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drive File Text Extractor</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background-color: #1e1e1e;
            color: #f0f0f0;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }
        h2 { text-align: center; color: #4CAF50; }
        .container {
            background: #2d2d2d;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px;
            border: 1px solid #444;
            background: #1e1e1e;
            color: #fff;
            border-radius: 4px;
            font-size: 16px;
        }
        button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover { background-color: #45a049; }
        textarea {
            width: 100%;
            height: 300px;
            padding: 10px;
            border: 1px solid #444;
            background: #1e1e1e;
            color: #00ff00;
            border-radius: 4px;
            font-family: monospace;
            font-size: 14px;
            resize: vertical;
            box-sizing: border-box;
        }
        .message { font-weight: bold; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Google Drive File to Text</h2>
        <p>Paste a public Drive link (e.g., .txt, .json) to extract its raw text.</p>
        
        <div class="input-group">
            <input type="text" id="driveLink" placeholder="https://drive.google.com/file/d/1aBcD_.../view">
            <button onclick="extractText()">Extract Text</button>
        </div>

        <div id="statusMessage" class="message"></div>
        <textarea id="outputArea" placeholder="Extracted text will appear here..." readonly></textarea>
    </div>

    <script>
        async function extractText() {
            const urlInput = document.getElementById('driveLink').value;
            const outputArea = document.getElementById('outputArea');
            const statusMessage = document.getElementById('statusMessage');
            
            outputArea.value = '';
            statusMessage.textContent = '';

            if (!urlInput) {
                statusMessage.textContent = 'Please enter a link.';
                statusMessage.style.color = '#ff5555';
                return;
            }

            const fileIdMatch = urlInput.match(/(?:d\/|id=)([\w-]{25,})/);
            if (!fileIdMatch) {
                statusMessage.textContent = 'Invalid link. Could not find a File ID.';
                statusMessage.style.color = '#ff5555';
                return;
            }

            const fileId = fileIdMatch[1];

            try {
                statusMessage.style.color = '#aaaaaa';
                statusMessage.textContent = 'Pulling raw file from Drive...';

                // Target the exact Google Drive file download endpoint (NO Google Docs API)
                const driveFileUrl = `https://drive.google.com/uc?export=download&id=${fileId}`;
                
                // Route through a public proxy to bypass browser CORS blocks
                const proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(driveFileUrl);

                const response = await fetch(proxyUrl);
                
                if (!response.ok) {
                    throw new Error(`Failed to fetch: ${response.status}`);
                }

                const text = await response.text();

                // If the file isn't public, or if it's too large and triggers Google's virus scan warning, it returns HTML
                if (text.trim().toLowerCase().startsWith('<!doctype html>') || text.toLowerCase().includes('<html')) {
                    throw new Error("Could not extract text. The file might not be public, or it is too large and triggered a virus scan prompt.");
                }

                outputArea.value = text;
                statusMessage.textContent = 'Done!';
                statusMessage.style.color = '#4CAF50';

            } catch (error) {
                statusMessage.style.color = '#ff5555';
                statusMessage.textContent = error.message;
            }
        }
    </script>
</body>
</html>
