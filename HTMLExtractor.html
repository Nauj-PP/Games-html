<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HTML5 Code Extractor</title>
  <style>
    body { background: #1a1a1a; color: white; font-family: sans-serif; padding: 30px; text-align: center; margin: 0; }
    .container { max-width: 800px; margin: auto; }
    .drop-zone { border: 2px dashed #00ff88; padding: 30px; border-radius: 10px; cursor: pointer; background: #222; margin-bottom: 20px; transition: 0.2s; }
    .drop-zone:hover { background: #2a2a2a; }
    textarea { width: 100%; height: 400px; background: #000; color: #00ff00; font-family: monospace; padding: 15px; border: 1px solid #333; border-radius: 5px; box-sizing: border-box; resize: vertical; }
    .btn { padding: 12px 25px; cursor: pointer; background: #4285f4; color: white; font-weight: bold; border: none; border-radius: 5px; font-size: 16px; transition: 0.2s; }
    .btn:hover { background: #3367d6; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  </style>
</head>
<body>
  <div class="container">
    <h2 style="color: #00ff88;">HTML5 Code Extractor</h2>
    <div class="drop-zone" onclick="document.getElementById('fileInput').click()">
      <p>Click here to select your HTML game file</p>
      <input type="file" id="fileInput" accept=".html,.htm" style="display: none;" onchange="loadFile(event)">
    </div>

    <div id="resultArea" style="display: none;">
      <div class="top-bar">
        <span id="fileName" style="color: #aaa; font-weight: bold;"></span>
        <button class="btn" id="copyBtn" onclick="copyCode()">COPY ALL</button>
      </div>
      <textarea id="codeBox" readonly></textarea>
    </div>
  </div>

  <script>
    function loadFile(event) {
      const file = event.target.files[0];
      if (!file) return;

      document.getElementById('fileName').innerText = "File: " + file.name;
      
      const reader = new FileReader();
      reader.onload = function(e) {
        document.getElementById('codeBox').value = e.target.result;
        document.getElementById('resultArea').style.display = 'block';
      };
      reader.readAsText(file);
    }

    function copyCode() {
      const codeBox = document.getElementById('codeBox');
      const btn = document.getElementById('copyBtn');
      
      navigator.clipboard.writeText(codeBox.value).then(() => {
        btn.innerText = "COPIED!";
        btn.style.background = "#00ff88";
        btn.style.color = "black";
        setTimeout(() => {
          btn.innerText = "COPY ALL";
          btn.style.background = "#4285f4";
          btn.style.color = "white";
        }, 2000);
      });
    }
  </script>
</body>
</html>
