<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Drive Text Extractor</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }
        h2 { text-align: center; color: #1a73e8; }
        .container {
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }
        button {
            padding: 10px 20px;
            background-color: #1a73e8;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover { background-color: #1557b0; }
        textarea {
            width: 100%;
            height: 300px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-family: monospace;
            font-size: 14px;
            resize: vertical;
            box-sizing: border-box;
        }
        .error { color: #d93025; font-weight: bold; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Google Doc to Plain Text</h2>
        <p>Paste a public Google Doc link below to extract its text.</p>
        
        <div class="input-group">
            <input type="text" id="driveLink" placeholder="https://docs.google.com/document/d/1aBcD_.../edit">
            <button onclick="extractText()">Extract Text</button>
        </div>

        <div id="statusMessage" class="error"></div>
        <textarea id="outputArea" placeholder="Your extracted text will appear here..." readonly></textarea>
    </div>

    <script>
        // --- IMPORTANT: REPLACE WITH YOUR OWN GOOGLE API KEY ---
        const API_KEY = 'YOUR_GOOGLE_API_KEY_HERE';

        async function extractText() {
            const urlInput = document.getElementById('driveLink').value;
            const outputArea = document.getElementById('outputArea');
            const statusMessage = document.getElementById('statusMessage');
            
            outputArea.value = '';
            statusMessage.textContent = '';

            if (!urlInput) {
                statusMessage.textContent = 'Please enter a Google Drive link.';
                return;
            }

            // 1. Extract the File ID from the URL using Regex
            const fileIdMatch = urlInput.match(/(?:d\/|id=)([\w-]{25,})/);
            
            if (!fileIdMatch || fileIdMatch.length < 2) {
                statusMessage.textContent = 'Invalid Google Drive link. Could not find File ID.';
                return;
            }

            const fileId = fileIdMatch[1];

            // 2. Construct the Google Drive API URL to export a Google Doc as plain text
            const apiUrl = `https://www.googleapis.com/drive/v3/files/${fileId}/export?mimeType=text/plain&key=${API_KEY}`;

            try {
                statusMessage.style.color = '#333';
                statusMessage.textContent = 'Fetching text...';

                // 3. Fetch the data
                const response = await fetch(apiUrl);

                if (!response.ok) {
                    if (response.status === 403 || response.status === 401) {
                        throw new Error("Permission denied. Ensure the document is public and your API key is valid.");
                    } else if (response.status === 404) {
                        throw new Error("File not found. Check the link.");
                    } else if (response.status === 400) {
                        throw new Error("Bad request. The file might not be a Google Doc (e.g., it's a PDF or Image).");
                    }
                    throw new Error(`Error: ${response.status} ${response.statusText}`);
                }

                const text = await response.text();
                outputArea.value = text;
                statusMessage.textContent = 'Text extracted successfully!';
                statusMessage.style.color = '#188038';

            } catch (error) {
                statusMessage.style.color = '#d93025';
                statusMessage.textContent = error.message;
            }
        }
    </script>
</body>
</html>
