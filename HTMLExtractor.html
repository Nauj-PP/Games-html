<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Extractor de Texto Plano - Google Drive</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 30px auto;
      padding: 0 20px;
      background-color: #f4f6f8;
      color: #333;
    }
    h2 {
      margin-bottom: 10px;
    }
    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    input[type="text"] {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }
    button {
      padding: 10px 20px;
      background-color: #0066ff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background-color: #0052cc;
    }
    textarea {
      width: 100%;
      height: 400px;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-family: monospace;
      font-size: 13px;
      box-sizing: border-box;
      background-color: #fff;
      resize: vertical;
    }
    .status {
      margin-bottom: 10px;
      font-size: 14px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h2>Extractor de Contenido de Google Drive</h2>
  <p>Pega un enlace público de un archivo de texto, código o JSON almacenado en Drive para obtener su contenido de forma directa:</p>

  <div class="input-group">
    <input 
      type="text" 
      id="driveUrl" 
      placeholder="https://drive.google.com/file/d/1YsjY3ZrCYk0iTMOeY4vxCfYf03ptfytg/view?usp=sharing"
    >
    <button onclick="extraerTexto()">Obtener Texto</button>
  </div>

  <div id="status" class="status"></div>
  <textarea id="output" placeholder="El texto plano aparecerá aquí..." readonly></textarea>

  <script>
    async function extraerTexto() {
      const urlInput = document.getElementById('driveUrl').value.trim();
      const statusDiv = document.getElementById('status');
      const outputArea = document.getElementById('output');

      // Extraer el ID único del archivo usando una expresión regular
      const match = urlInput.match(/\/d\/([a-zA-Z0-9_-]+)/);

      if (!match) {
        statusDiv.style.color = 'red';
        statusDiv.textContent = '❌ Por favor introduce un enlace válido de Google Drive.';
        return;
      }

      const fileId = match[1];
      const directUrl = `https://drive.google.com/uc?export=view&id=${fileId}`;

      statusDiv.style.color = '#0066ff';
      statusDiv.textContent = '⏳ Cargando contenido...';
      outputArea.value = '';

      try {
        const response = await fetch(directUrl);
        if (!response.ok) {
          throw new Error('No se pudo acceder al archivo.');
        }
        const text = await response.text();
        
        outputArea.value = text;
        statusDiv.style.color = 'green';
        statusDiv.textContent = '✅ ¡Texto obtenido con éxito!';
      } catch (error) {
        statusDiv.style.color = 'red';
        statusDiv.textContent = '❌ Error al cargar. Asegúrate de que el archivo sea público ("Cualquier persona con el enlace").';
      }
    }
  </script>

</body>
</html>
