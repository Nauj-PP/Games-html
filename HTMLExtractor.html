<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: sans-serif; padding: 30px; text-align: center; background: #1a1a1a; color: white; min-height: 100vh; margin: 0; }
    input { width: 80%; padding: 12px; border-radius: 5px; border: none; margin-bottom: 10px; }
    button { padding: 12px 25px; cursor: pointer; background: #00ff88; color: black; font-weight: bold; border: none; border-radius: 5px; }
    #resultArea { display: none; margin-top: 30px; text-align: left; }
    textarea { width: 100%; height: 400px; background: #000; color: #00ff00; font-family: monospace; padding: 10px; border: 1px solid #333; border-radius: 5px; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  </style>
</head>
<body>
  <h2>HTML Code Extractor</h2>
  <p>Paste Google Drive Link:</p>
  <input type="text" id="link" placeholder="https://drive.google.com/file/d/..."> 
  <br>
  <button onclick="fetchCode()" id="mainBtn">GET CODE</button>
  
  <div id="resultArea">
    <div class="top-bar">
      <span>Preview:</span>
      <button onclick="copyToClipboard()" id="copyBtn" style="background: #4285f4; color: white; padding: 8px 20px;">COPY ALL</button>
    </div>
    <textarea id="codeBox" readonly></textarea>
  </div>
  <p id="status" style="margin-top: 10px; color: #888;"></p>

  <script>
    function fetchCode() {
      var val = document.getElementById("link").value;
      var id = val.match(/[-\w]{25,}/);
      var btn = document.getElementById("mainBtn");
      if (!id) { alert("Invalid Drive Link!"); return; }
      
      btn.innerText = "Loading...";
      google.script.run
        .withSuccessHandler(function(code) {
          document.getElementById("codeBox").value = code;
          document.getElementById("resultArea").style.display = "block";
          btn.innerText = "GET CODE";
          document.getElementById("status").innerText = "Code loaded below.";
        })
        .withFailureHandler(function(err) {
          btn.innerText = "GET CODE";
          alert("Error: " + err.message);
        })
        .getFileContent(id[0]);
    }
    
    function copyToClipboard() {
      var copyText = document.getElementById("codeBox");
      var btn = document.getElementById("copyBtn");
      copyText.select();
      navigator.clipboard.writeText(copyText.value).then(() => {
        btn.innerText = "COPIED!";
        setTimeout(() => { btn.innerText = "COPY ALL"; }, 2000);
      });
    }
  </script>
</body>
</html>
