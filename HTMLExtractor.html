<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Drive Plain Text Extractor</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 30px auto;
      padding: 0 20px;
      background-color: #f4f6f8;
      color: #333;
    }
    h2 {
      margin-bottom: 10px;
    }
    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    input[type="text"] {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }
    button {
      padding: 10px 20px;
      background-color: #0066ff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background-color: #0052cc;
    }
    textarea {
      width: 100%;
      height: 400px;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-family: monospace;
      font-size: 13px;
      box-sizing: border-box;
      background-color: #fff;
      resize: vertical;
    }
    .status {
      margin-bottom: 10px;
      font-size: 14px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h2>Google Drive Text Extractor</h2>
  <p>Paste a public Google Drive file link below to retrieve its raw text content directly:</p>

  <div class="input-group">
    <input 
      type="text" 
      id="driveUrl" 
      placeholder="https://drive.google.com/file/d/1YsjY3ZrCYk0iTMOeY4vxCfYf03ptfytg/view?usp=sharing"
    >
    <button onclick="extractText()">Get Plain Text</button>
  </div>

  <div id="status" class="status"></div>
  <textarea id="output" placeholder="Plain text output will appear here..." readonly></textarea>

  <script>
    async function extractText() {
      const urlInput = document.getElementById('driveUrl').value.trim();
      const statusDiv = document.getElementById('status');
      const outputArea = document.getElementById('output');

      // Extract the unique File ID using Regular Expressions
      const match = urlInput.match(/\/d\/([a-zA-Z0-9_-]+)/);

      if (!match) {
        statusDiv.style.color = 'red';
        statusDiv.textContent = '❌ Please enter a valid Google Drive link.';
        return;
      }

      const fileId = match[1];
      const directUrl = `https://drive.google.com/uc?export=download&id=${fileId}`;
      
      // Use CORS Proxy to bypass browser cross-origin blocking
      const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(directUrl)}`;

      statusDiv.style.color = '#0066ff';
      statusDiv.textContent = '⏳ Fetching file content...';
      outputArea.value = '';

      try {
        const response = await fetch(proxyUrl);
        if (!response.ok) {
          throw new Error('Failed to fetch the file.');
        }
        const text = await response.text();
        
        outputArea.value = text;
        statusDiv.style.color = 'green';
        statusDiv.textContent = '✅ Content retrieved successfully!';
      } catch (error) {
        statusDiv.style.color = 'red';
        statusDiv.textContent = '❌ Fetch error. Make sure "Anyone with the link" access is enabled.';
      }
    }
  </script>

</body>
</html>
